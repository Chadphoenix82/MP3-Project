name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v4.0). Leave blank to use versionName from app/build.gradle.kts."
        required: false
        default: ""
      publish_release:
        description: "Publish APK as a downloadable GitHub Release"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve app version
        id: version
        run: |
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v${APP_VERSION}"
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.build_type }}" = "release" ]; then
            gradle :app:assembleRelease --no-daemon
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          else
            gradle :app:assembleDebug --no-daemon
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          fi
          mkdir -p dist
          APK_OUT="dist/PhotonAudio-${{ steps.version.outputs.tag_name }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "Built APK: $APK_OUT"
          ls -lh "$APK_OUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonAudio-${{ steps.version.outputs.tag_name }}-apk
          path: dist/*.apk
          retention-days: 90

      - name: Publish downloadable APK to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Photon Audio ${{ steps.version.outputs.tag_name }}
          body: |
            ## Photon Audio ${{ steps.version.outputs.tag_name }}

            Download the Android APK attached below (`PhotonAudio-${{ steps.version.outputs.tag_name }}.apk`) and open it on your Android device to install or update Photon Audio.
          files: dist/*.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
